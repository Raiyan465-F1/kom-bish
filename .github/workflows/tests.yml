name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-render.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          MODEL_REPO: ${{ vars.MODEL_REPO }}
